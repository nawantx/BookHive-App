<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BookHive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="hero" style="background-image: url('Photo1.jpg');">
    <div class="overlay"></div>

    <header class="top-nav">
      <nav>
        <ul>
          <li><a href="wishlist.html">WishList (<span id="wishlistCount">0</span>)</a></li>
        </ul>
      </nav>
    </header>

    <div class="content">
      <h1 class="title">BookHive</h1>
      <p class="subtitle">Search for Books by Title, Author, or Description</p>

      <form id="searchForm" class="search" role="search">
        <input
          id="q"
          class="input"
          type="search"
          placeholder="Search for books"
          aria-label="Search for books"
          required
        />
        <button class="btn" type="submit">Search</button>
      </form>

      <section id="results" class="results"></section>

      <nav class="links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
